<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paldium</title>
    <base href="/" />
    <!-- Splash styles are inline because app.css may not be loaded yet (Grafit ground and ink). -->
    <style>
        html, body { margin: 0; background: #151515; color: #f0f0f0; }
        .pb-splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
                     font-family: "IBM Plex Sans", "Segoe UI Variable Text", sans-serif; font-size: 16px; line-height: 22px; font-weight: 600; }
        .pb-splash img { width: 64px; height: 64px; }
    </style>
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="app"><div class="pb-splash"><img src="img/app-128.png" alt="" /><span>Paldium</span></div></div>
    <script>
        window.setDocumentLanguage = function (lang) { document.documentElement.lang = lang; };

        window.pbWatchCompactNav = function (dotNetRef) {
            const query = window.matchMedia('(max-width: 1199px)');
            dotNetRef.invokeMethodAsync('SetCompact', query.matches);
            const onChange = function (e) { dotNetRef.invokeMethodAsync('SetCompact', e.matches); };
            query.addEventListener('change', onChange);
            return { dispose: function () { query.removeEventListener('change', onChange); } };
        };

        window.pbFocusTitle = function (toTop) {
            const focus = function () {
                if (toTop) {
                    const body = document.getElementById('icerik');
                    if (body) body.scrollTop = 0;
                    window.scrollTo(0, 0);
                }
                const title = document.querySelector('#icerik h1');
                if (title) title.focus({ preventScroll: true });
            };
            requestAnimationFrame(function () { requestAnimationFrame(focus); });
        };

        // Guide reader: marks the heading in view, reports the read share of the text and lets Esc leave the reading mode.
        window.pbGuideReader = {
            attach: function (grid, dotNet, ids) {
                const onScroll = function () {
                    const top = grid.getBoundingClientRect().top;
                    let current = ids.length ? ids[0] : null;
                    for (const id of ids) {
                        const el = grid.querySelector('#' + CSS.escape(id));
                        if (el && el.getBoundingClientRect().top - top <= 80) current = id;
                    }
                    const max = grid.scrollHeight - grid.clientHeight;
                    const percent = max <= 0 ? 0 : Math.round(grid.scrollTop / max * 100);
                    dotNet.invokeMethodAsync('OnScrolled', current, percent);
                };
                const onKey = function (e) { if (e.key === 'Escape') dotNet.invokeMethodAsync('OnEscape'); };
                grid.scrollTop = 0;
                grid.addEventListener('scroll', onScroll, { passive: true });
                document.addEventListener('keydown', onKey);
                return {
                    dispose: function () {
                        grid.removeEventListener('scroll', onScroll);
                        document.removeEventListener('keydown', onKey);
                    }
                };
            },
            scrollTo: function (grid, id) {
                const el = grid.querySelector('#' + CSS.escape(id));
                if (!el) return;
                const delta = el.getBoundingClientRect().top - grid.getBoundingClientRect().top - 12;
                grid.scrollTo({ top: grid.scrollTop + delta, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
            }
        };

        window.pbCopyText = async function (text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch {
                return false;
            }
        };

        // Tracks focus before a drawer opens, moves focus into it, listens for Escape, and returns focus on close.
        window.pbDrawer = (function () {
            const stack = [];

            function closeTopOnEsc(e) {
                if (e.key !== 'Escape' || stack.length === 0) return;
                const top = stack[stack.length - 1];
                e.preventDefault();
                e.stopPropagation();
                top.dotNet.invokeMethodAsync('RequestClose');
            }

            return {
                attach: function (el, dotNet) {
                    const trigger = document.activeElement instanceof HTMLElement ? document.activeElement : null;
                    const entry = { el, dotNet, trigger };
                    stack.push(entry);
                    if (stack.length === 1) document.addEventListener('keydown', closeTopOnEsc, true);
                    requestAnimationFrame(function () {
                        if (!el) return;
                        const target = el.querySelector('[data-drawer-initial]') || el.querySelector('button:not([disabled]), input:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])') || el;
                        if (target && typeof target.focus === 'function') target.focus({ preventScroll: true });
                    });
                },
                detach: function (el, restoreFocus) {
                    const idx = stack.findIndex(function (x) { return x.el === el; });
                    let entry = null;
                    if (idx >= 0) {
                        entry = stack[idx];
                        stack.splice(idx, 1);
                    }
                    if (stack.length === 0) document.removeEventListener('keydown', closeTopOnEsc, true);
                    if (restoreFocus && entry && entry.trigger && document.contains(entry.trigger)) {
                        requestAnimationFrame(function () {
                            if (document.contains(entry.trigger)) entry.trigger.focus({ preventScroll: true });
                        });
                    }
                },
                ensureFocus: function (el) {
                    if (!el || !document.contains(el)) return;
                    if (!el.contains(document.activeElement)) {
                        requestAnimationFrame(function () {
                            if (document.contains(el) && !el.contains(document.activeElement)) el.focus({ preventScroll: true });
                        });
                    }
                }
            };
        })();

        window.pbFocusElement = (el) => {
            if (!el || typeof el.focus !== 'function') return;
            requestAnimationFrame(() => el.focus({ preventScroll: true }));
        };

        // Technology page (T128): the level list's scroll position and the jump bar.
        window.pbTrackScroll = (el) => {
            if (!el || el.__pbScrollTracked) return;
            el.__pbScrollTracked = true;
            el.__pbLastScroll = el.scrollTop;
            el.addEventListener('scroll', () => { el.__pbLastScroll = el.scrollTop; }, { passive: true });
        };
        window.pbGetScrollTop = (el) => !el ? null : (el.isConnected ? el.scrollTop : (typeof el.__pbLastScroll === 'number' ? el.__pbLastScroll : null));
        window.pbSetScrollTop = (el, top) => {
            if (!el) return;
            window.pbTrackScroll(el);
            if (top > 0) requestAnimationFrame(() => { el.scrollTop = top; el.__pbLastScroll = top; });
        };
        window.pbScrollToLevel = (list, id) => {
            const el = document.getElementById(id);
            if (!list || !el) return;
            list.scrollTop = el.getBoundingClientRect().top - list.getBoundingClientRect().top + list.scrollTop;
        };

        window.pbFocusSiblingRow = (tbody, delta) => {
            if (!tbody) return;
            const rows = Array.from(tbody.querySelectorAll('tr[data-row]'));
            if (rows.length === 0) return;
            const active = document.activeElement instanceof HTMLElement ? document.activeElement.closest('tr[data-row]') : null;
            const idx = active ? rows.indexOf(active) : -1;
            const nextIdx = idx < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, idx + delta));
            const target = rows[nextIdx];
            if (target && typeof target.focus === 'function') {
                target.focus();
                target.scrollIntoView({ block: 'nearest' });
            }
        };

        window.pbShowModal = function (dlg) {
            if (!dlg || typeof dlg.showModal !== 'function') return;
            if (!dlg.open) dlg.showModal();
        };

        window.pbFocusId = function (id) {
            const el = id ? document.getElementById(id) : null;
            if (el) el.focus();
        };

        window.pbCloseModal = function (dlg) {
            if (!dlg || typeof dlg.close !== 'function') return;
            if (dlg.open) dlg.close();
        };

        window.pbGridColumns = (function () {
            const watchers = new WeakMap();
            function compute(el, minW, gap) {
                if (!el) return 4;
                const style = getComputedStyle(el);
                const pad = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
                const avail = Math.max(0, el.clientWidth - pad);
                return Math.max(1, Math.floor((avail + gap) / (minW + gap)));
            }
            return {
                observe: function (el, dotNet, minW, gap) {
                    if (!el) return 4;
                    this.unobserve(el);
                    let last = compute(el, minW, gap);
                    const ro = new ResizeObserver(function () {
                        const next = compute(el, minW, gap);
                        if (next !== last) {
                            last = next;
                            dotNet.invokeMethodAsync('OnColumnsChanged', next);
                        }
                    });
                    ro.observe(el);
                    const onKey = function (e) {
                        if (e.ctrlKey || e.altKey || e.metaKey) return;
                        if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Home' || e.key === 'End') {
                            e.preventDefault();
                        }
                    };
                    el.addEventListener('keydown', onKey, false);
                    watchers.set(el, { ro: ro, onKey: onKey });
                    return last;
                },
                unobserve: function (el) {
                    if (!el) return;
                    const entry = watchers.get(el);
                    if (entry) {
                        entry.ro.disconnect();
                        el.removeEventListener('keydown', entry.onKey, false);
                        watchers.delete(el);
                    }
                }
            };
        })();

        window.pbFocusGridCard = function (container, cardIndex, scrollTopTarget) {
            if (!container) return;
            if (typeof scrollTopTarget === 'number' && scrollTopTarget >= 0) {
                const maxTop = Math.max(0, container.scrollHeight - container.clientHeight);
                container.scrollTop = Math.min(maxTop, scrollTopTarget);
            }
            const tryFocus = function (attempt) {
                const btn = container.querySelector('[data-card-index="' + cardIndex + '"] button.card-act');
                if (btn && typeof btn.focus === 'function') {
                    btn.focus();
                    btn.scrollIntoView({ block: 'nearest' });
                } else if (attempt < 4) {
                    requestAnimationFrame(function () { tryFocus(attempt + 1); });
                }
            };
            requestAnimationFrame(function () { tryFocus(0); });
        };

        // Left panel width (T102): the handle sets --panel-w on its grid while dragging and reports the final width to .NET.
        window.pbPanelResize = {
            attach: function (handle, dotNet, opts) {
                const work = handle.parentElement;
                const panel = function () { return handle.previousElementSibling; };
                const clamp = function (w) {
                    const total = work.getBoundingClientRect().width;
                    const max = Math.max(opts.min, Math.min(opts.max, total - opts.minContent));
                    return Math.max(opts.min, Math.min(max, Math.round(w)));
                };
                const apply = function (w) {
                    work.style.setProperty('--panel-w', w + 'px');
                    handle.setAttribute('aria-valuenow', String(w));
                };
                apply(opts.width);
                let startX = 0, startW = 0, dragging = false;
                const down = function (e) {
                    if (e.button !== 0) return;
                    dragging = true;
                    startX = e.clientX;
                    startW = panel() ? panel().getBoundingClientRect().width : opts.width;
                    handle.setPointerCapture(e.pointerId);
                    handle.classList.add('drag');
                    document.body.classList.add('panel-resizing');
                    e.preventDefault();
                };
                const move = function (e) {
                    if (!dragging) return;
                    apply(clamp(startW + e.clientX - startX));
                };
                const up = function (e) {
                    if (!dragging) return;
                    dragging = false;
                    handle.classList.remove('drag');
                    document.body.classList.remove('panel-resizing');
                    try { handle.releasePointerCapture(e.pointerId); } catch (x) { }
                    dotNet.invokeMethodAsync('OnResized', Number(handle.getAttribute('aria-valuenow')));
                };
                const dbl = function () {
                    dotNet.invokeMethodAsync('OnReset').then(function (w) { apply(w); });
                };
                const key = function (e) {
                    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
                    e.preventDefault();
                    const current = Number(handle.getAttribute('aria-valuenow')) || opts.width;
                    const next = clamp(current + (e.key === 'ArrowRight' ? opts.step : -opts.step));
                    apply(next);
                    dotNet.invokeMethodAsync('OnResized', next);
                };
                handle.addEventListener('pointerdown', down);
                handle.addEventListener('pointermove', move);
                handle.addEventListener('pointerup', up);
                handle.addEventListener('pointercancel', up);
                handle.addEventListener('dblclick', dbl);
                handle.addEventListener('keydown', key);
                return {
                    dispose: function () {
                        handle.removeEventListener('pointerdown', down);
                        handle.removeEventListener('pointermove', move);
                        handle.removeEventListener('pointerup', up);
                        handle.removeEventListener('pointercancel', up);
                        handle.removeEventListener('dblclick', dbl);
                        handle.removeEventListener('keydown', key);
                    }
                };
            }
        };

        window.pbKeyShortcut = (function () {
            const entries = [];
            function onKeyDown(e) {
                if (e.defaultPrevented || e.key !== 'Enter' || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
                if (entries.length === 0) return;
                const active = document.activeElement;
                if (active) {
                    const tag = active.tagName;
                    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || active.isContentEditable) return;
                    if (tag === 'BUTTON' || tag === 'A') return;
                    if (active.closest('.mud-popover, [role="dialog"], dialog, [role="listbox"], [role="menu"], .drawer')) return;
                }
                if (document.querySelector('.mud-popover-open, .drawer, dialog[open]')) return;
                const top = entries[entries.length - 1];
                e.preventDefault();
                top.dotNet.invokeMethodAsync(top.method);
            }
            return {
                attach: function (dotNet, method) {
                    const entry = { dotNet, method };
                    entries.push(entry);
                    if (entries.length === 1) document.addEventListener('keydown', onKeyDown, false);
                    return {
                        dispose: function () {
                            const idx = entries.indexOf(entry);
                            if (idx >= 0) entries.splice(idx, 1);
                            if (entries.length === 0) document.removeEventListener('keydown', onKeyDown, false);
                        }
                    };
                },
                detach: function (dotNet) {
                    const idx = entries.findIndex(x => x.dotNet === dotNet);
                    if (idx >= 0) entries.splice(idx, 1);
                    if (entries.length === 0) document.removeEventListener('keydown', onKeyDown, false);
                }
            };
        })();

        window.pbPaldex = (function () {
            let savedScrollTop = 0;
            function findListScroller() {
                return document.querySelector('.x .lscroll') || document.querySelector('.x .tblwrap');
            }
            return {
                saveScroll: function () {
                    const el = findListScroller();
                    savedScrollTop = el ? el.scrollTop : 0;
                    return savedScrollTop;
                },
                restoreScroll: function () {
                    const top = savedScrollTop;
                    if (!top) return;
                    const tryRestore = function (attempt) {
                        const el = findListScroller();
                        if (el) {
                            el.scrollTop = top;
                        } else if (attempt < 4) {
                            requestAnimationFrame(function () { tryRestore(attempt + 1); });
                        }
                    };
                    requestAnimationFrame(function () { tryRestore(0); });
                }
            };
        })();

        window.pbDetailNav = (function () {
            const state = { dotNet: null, keyHandler: null, scrollHandler: null, dmain: null, timer: 0 };
            return {
                attach: function (dmain, dotNet) {
                    this.detach();
                    state.dotNet = dotNet;
                    state.dmain = dmain;
                    state.keyHandler = function (e) {
                        if (e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
                        const active = document.activeElement;
                        if (active) {
                            const tag = active.tagName;
                            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || active.isContentEditable) return;
                            if (active.closest('.mud-popover, [role="dialog"], dialog, .drawer')) return;
                            if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && active.closest('[role="radiogroup"]')) return;
                        }
                        if (document.querySelector('.mud-popover-open, .drawer, dialog[open]')) return;
                        if (e.key === 'ArrowLeft') { e.preventDefault(); dotNet.invokeMethodAsync('OnShortcutPrev'); }
                        else if (e.key === 'ArrowRight') { e.preventDefault(); dotNet.invokeMethodAsync('OnShortcutNext'); }
                        else if (e.key === 'Escape') { e.preventDefault(); dotNet.invokeMethodAsync('OnShortcutClose'); }
                    };
                    document.addEventListener('keydown', state.keyHandler, false);

                    if (dmain) {
                        state.scrollHandler = function () {
                            if (state.timer) return;
                            state.timer = requestAnimationFrame(function () {
                                state.timer = 0;
                                if (!state.dmain || !state.dotNet) return;
                                const sections = state.dmain.querySelectorAll('section.dsec[id]');
                                const anchor = state.dmain.querySelector('.anch');
                                const offset = (anchor ? anchor.offsetHeight : 0) + 24;
                                const containerTop = state.dmain.getBoundingClientRect().top;
                                let current = '';
                                sections.forEach(function (sec) {
                                    if (sec.getBoundingClientRect().top - containerTop <= offset) {
                                        current = sec.id;
                                    }
                                });
                                if (!current && sections.length > 0) current = sections[0].id;
                                if (current) state.dotNet.invokeMethodAsync('OnActiveSectionChanged', current);
                            });
                        };
                        dmain.addEventListener('scroll', state.scrollHandler, { passive: true });
                    }
                },
                scrollTo: function (dmain, id) {
                    if (!dmain) return;
                    const sec = dmain.querySelector('#' + CSS.escape(id));
                    if (!sec) return;
                    const anchor = dmain.querySelector('.anch');
                    const top = sec.offsetTop - (anchor ? anchor.offsetHeight + 12 : 12);
                    dmain.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
                },
                scrollTopAll: function () {
                    const dmain = document.querySelector('.x .dmain');
                    if (dmain) dmain.scrollTop = 0;
                    const hero = document.querySelector('.x .hero');
                    if (hero) hero.scrollTop = 0;
                },
                detach: function () {
                    if (state.timer) { cancelAnimationFrame(state.timer); state.timer = 0; }
                    if (state.keyHandler) { document.removeEventListener('keydown', state.keyHandler, false); state.keyHandler = null; }
                    if (state.dmain && state.scrollHandler) { state.dmain.removeEventListener('scroll', state.scrollHandler); }
                    state.scrollHandler = null;
                    state.dmain = null;
                    state.dotNet = null;
                }
            };
        })();
    </script>
    <script src="js/mapview.js"></script>
    <script src="_framework/blazor.webview.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
